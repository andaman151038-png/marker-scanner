<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบสแกนคำตอบ (A,B,C,D)</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/jcmellado/js-aruco/src/cv.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/jcmellado/js-aruco/src/aruco.js"></script>
    <style>
        body { text-align: center; font-family: sans-serif; margin: 0; background-color: #f0f0f0; }
        h2 { font-size: 1.2rem; margin: 10px 0; }
        .container { display: flex; justify-content: center; align-items: center; flex-direction: column; width: 100%; padding: 10px; box-sizing: border-box; }
        
        canvas { 
            border: 2px solid #333; 
            border-radius: 8px; 
            background-color: #000; 
            width: 100%; 
            max-width: 600px; 
            height: auto; 
        }
        
        button { margin-top: 15px; padding: 12px 24px; font-size: 18px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:active { background-color: #0056b3; }
    </style>
</head>
<body>
    <h2>สแกนหาคำตอบ (เปิดผ่าน Chrome/Safari เท่านั้น)</h2>
    <div class="container">
        <video id="video" autoplay playsinline style="display:none;"></video>
        <canvas id="canvas"></canvas>
        <button id="startBtn">เปิดกล้อง / เริ่มสแกน</button>
    </div>

    <script>
        let video = document.getElementById("video");
        let canvas = document.getElementById("canvas");
        let context = canvas.getContext("2d");
        let startBtn = document.getElementById("startBtn");
        let detector = new AR.Detector();
        let isScanning = false;

        function startCamera() {
            // จำกัดความละเอียดของกล้องเพื่อไม่ให้มือถือทำงานหนักเกินไป
            let constraints = { 
                video: { 
                    facingMode: "environment",
                    width: { ideal: 640 }, // ร้องขอภาพขนาดเล็กลง
                    height: { ideal: 480 }
                } 
            };

            navigator.mediaDevices.getUserMedia(constraints)
                .then(function(stream) {
                    video.srcObject = stream;
                    video.play();
                    isScanning = true;
                    startBtn.innerText = "กำลังสแกน...";
                    startBtn.style.backgroundColor = "#28a745";
                    
                    video.onloadedmetadata = function() {
                        // บังคับจำกัดขนาด Canvas ในการประมวลผล (Downscale)
                        let maxRes = 640;
                        let ratio = video.videoWidth / video.videoHeight;
                        
                        if (video.videoWidth > maxRes) {
                            canvas.width = maxRes;
                            canvas.height = maxRes / ratio;
                        } else {
                            canvas.width = video.videoWidth;
                            canvas.height = video.videoHeight;
                        }
                        requestAnimationFrame(tick);
                    };
                })
                .catch(function(err) {
                    console.error("Error: ", err);
                    alert("ไม่สามารถเปิดกล้องได้");
                });
        }

        startBtn.addEventListener('click', function() {
            if (!isScanning) startCamera();
        });

        function tick() {
            if (isScanning && video.readyState === video.HAVE_ENOUGH_DATA) {
                requestAnimationFrame(tick);
                
                context.drawImage(video, 0, 0, canvas.width, canvas.height);
                let imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                let markers = detector.detect(imageData);

                if (markers.length > 0) {
                    for (let i = 0; i < markers.length; i++) {
                        let corners = markers[i].corners;
                        let markerId = markers[i].id;
                        
                        context.strokeStyle = "#00ff00";
                        context.lineWidth = 4;
                        context.beginPath();
                        context.moveTo(corners[0].x, corners[0].y);
                        context.lineTo(corners[1].x, corners[1].y);
                        context.lineTo(corners[2].x, corners[2].y);
                        context.lineTo(corners[3].x, corners[3].y);
                        context.closePath();
                        context.stroke();

                        let dx = corners[1].x - corners[0].x;
                        let dy = corners[1].y - corners[0].y;
                        let angle = Math.atan2(dy, dx) * (180 / Math.PI);
                        
                        if (angle < 0) angle += 360; 

                        let answer = "";
                        // ปรับองศาการตัดสินใจให้กว้างขึ้น เพื่อให้หมุนมือถือได้ง่ายขึ้น
                        if (angle >= 315 || angle < 45) {
                            answer = "A";
                        } else if (angle >= 45 && angle < 135) {
                            answer = "B";
                        } else if (angle >= 135 && angle < 225) {
                            answer = "C";
                        } else if (angle >= 225 && angle < 315) {
                            answer = "D";
                        }

                        let displayText = "ID: " + markerId + " = " + answer;
                        
                        context.fillStyle = "rgba(255, 255, 255, 0.8)";
                        context.fillRect(corners[0].x - 5, corners[0].y - 45, 160, 40);

                        context.fillStyle = "red";
                        context.font = "bold 26px Arial";
                        context.fillText(displayText, corners[0].x, corners[0].y - 15);
                    }
                }
            }
        }
    </script>
</body>
</html>
