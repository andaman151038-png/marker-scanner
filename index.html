<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ระบบสแกนคำตอบ (A,B,C,D)</title>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/jcmellado/js-aruco/src/cv.js"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/gh/jcmellado/js-aruco/src/aruco.js"></script>
    <style>
        body { text-align: center; font-family: sans-serif; margin: 0; background-color: #f0f0f0; }
        h2 { font-size: 1.2rem; margin: 10px 0; }
        .container { display: flex; justify-content: center; align-items: center; flex-direction: column; width: 100%; }
        canvas { border: 2px solid #333; border-radius: 8px; background-color: #000; max-width: 100%; height: auto; }
        button { margin-top: 15px; padding: 10px 20px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:active { background-color: #0056b3; }
    </style>
</head>
<body>
    <h2>สแกนหาคำตอบ (หมุนทิศทางเพื่อเปลี่ยนข้อ)</h2>
    <div class="container">
        <video id="video" autoplay playsinline style="display:none;"></video>
        <canvas id="canvas" width="640" height="480"></canvas>
        <button id="startBtn">เปิดกล้อง / เริ่มสแกน</button>
    </div>

    <script>
        let video = document.getElementById("video");
        let canvas = document.getElementById("canvas");
        let context = canvas.getContext("2d");
        let startBtn = document.getElementById("startBtn");
        let detector = new AR.Detector();
        let isScanning = false;

        function startCamera() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } })
                .then(function(stream) {
                    video.srcObject = stream;
                    video.play();
                    isScanning = true;
                    startBtn.innerText = "กำลังสแกน...";
                    startBtn.style.backgroundColor = "#28a745";
                    requestAnimationFrame(tick);
                })
                .catch(function(err) {
                    console.error("Error: ", err);
                    alert("ไม่สามารถเปิดกล้องได้");
                });
        }

        startBtn.addEventListener('click', function() {
            if (!isScanning) startCamera();
        });

        function tick() {
            if (isScanning) {
                requestAnimationFrame(tick);
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    context.drawImage(video, 0, 0, canvas.width, canvas.height);
                    let imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                    let markers = detector.detect(imageData);

                    if (markers.length > 0) {
                        for (let i = 0; i < markers.length; i++) {
                            let corners = markers[i].corners;
                            let markerId = markers[i].id;
                            
                            // 1. วาดเส้นกรอบรอบ Marker
                            context.strokeStyle = "#00ff00"; // เปลี่ยนกรอบเป็นสีเขียวให้เห็นชัดๆ
                            context.lineWidth = 3;
                            context.beginPath();
                            context.moveTo(corners[0].x, corners[0].y);
                            context.lineTo(corners[1].x, corners[1].y);
                            context.lineTo(corners[2].x, corners[2].y);
                            context.lineTo(corners[3].x, corners[3].y);
                            context.closePath();
                            context.stroke();

                            // 2. คำนวณมุมองศา เพื่อหาตัวเลือก A, B, C, D
                            // ใช้จุดที่ 0 และ 1 (ขอบด้านบนของ Marker) เพื่อดูว่าหมุนไปทางไหน
                            let dx = corners[1].x - corners[0].x;
                            let dy = corners[1].y - corners[0].y;
                            let angle = Math.atan2(dy, dx) * (180 / Math.PI);
                            
                            // ปรับค่ามุมให้เป็น 0 - 360 องศา
                            if (angle < 0) angle += 360; 

                            // กำหนดเงื่อนไขทิศทาง (เผื่อความคลาดเคลื่อนของการเอียงมือ +/- 45 องศา)
                            let answer = "";
                            if (angle >= 315 || angle < 45) {
                                answer = "A"; // ปกติ (ขอบบนอยู่ด้านบน)
                            } else if (angle >= 45 && angle < 135) {
                                answer = "B"; // หมุนขวา
                            } else if (angle >= 135 && angle < 225) {
                                answer = "C"; // กลับหัว
                            } else if (angle >= 225 && angle < 315) {
                                answer = "D"; // หมุนซ้าย
                            }

                            // 3. แสดงผลบนหน้าจอ (โชว์ทั้ง ID และคำตอบ)
                            let displayText = "ID: " + markerId + " = ข้อ " + answer;
                            
                            // สร้างพื้นหลังข้อความเพื่อให้เห็นชัดขึ้น
                            context.fillStyle = "rgba(255, 255, 255, 0.8)";
                            context.fillRect(corners[0].x - 5, corners[0].y - 45, 180, 40);

                            // พิมพ์ข้อความ
                            context.fillStyle = "red";
                            context.font = "bold 24px Arial";
                            context.fillText(displayText, corners[0].x, corners[0].y - 15);
                        }
                    }
                }
            }
        }
    </script>
</body>
</html>
